name: CI

# Vercel's GitHub integration handles deployments (previews on pull requests,
# production on main). This workflow only checks that the app builds.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next build generates the Next.js types and runs the type check itself.
      # A separate `tsc --noEmit` fails in CI because next-env.d.ts is git-ignored.
      - run: npm run build
